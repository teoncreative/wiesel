name: Build & Release Editor

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query-version: 1.3.290.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader, Glslang, SPIRV-Tools
          vulkan-use-cache: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Mono
        shell: pwsh
        run: |
          choco install mono -y --no-progress
          echo "C:\Program Files\Mono\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build bundle-editor
        run: cmake --build build --config Release --target bundle-editor -j $env:NUMBER_OF_PROCESSORS

      - name: Package bundle
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -match 'refs/tags/(.+)') { $Matches[1] } else { "dev-$(git rev-parse --short HEAD)" }
          Compress-Archive -Path build/bundle/* -DestinationPath "wiesel-editor-windows-$version.zip"
          echo "ARTIFACT_NAME=wiesel-editor-windows-$version.zip" >> $env:GITHUB_ENV
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiesel-editor-windows
          path: ${{ env.ARTIFACT_NAME }}

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT_NAME }}
          generate_release_notes: true

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev vulkan-validationlayers \
            libsdl2-dev libfreetype-dev \
            mono-devel mono-mcs \
            dotnet-sdk-8.0 \
            libx11-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query-version: 1.3.290.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader, Glslang, SPIRV-Tools
          vulkan-use-cache: true

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build bundle-editor
        run: cmake --build build --config Release --target bundle-editor -j$(nproc)

      - name: Package bundle
        run: |
          VERSION=$(echo "$GITHUB_REF" | grep -oP 'refs/tags/\K.+' || echo "dev-$(git rev-parse --short HEAD)")
          tar -czf "wiesel-editor-linux-$VERSION.tar.gz" -C build/bundle .
          echo "ARTIFACT_NAME=wiesel-editor-linux-$VERSION.tar.gz" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiesel-editor-linux
          path: ${{ env.ARTIFACT_NAME }}

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT_NAME }}
          generate_release_notes: true